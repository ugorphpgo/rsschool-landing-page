<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <title>Catalog</title>
    <script>
        const saved = localStorage.getItem('theme');
        if (saved) document.documentElement.dataset.theme = saved;
    </script>
    <link rel="stylesheet" href="assets/styles/normalize.css">
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
    <body>
    <header>
        <div class="header__container">
            <div class="header__menu">
                <a class="header__logo" href="index.html"><img alt="logotype" class="logo__image" src="assets/images/logo.png"></a>
                <nav class="header__nav">
                    <ul>
                        <li><a href="#favorite__coffee">Favorite coffee</a></li>
                        <li><a href="#about">About</a></li>
                        <li><a href="#app">Mobile app</a></li>
                        <li><a href="#contacts">Contact us</a></li>
                    </ul>
                </nav>
                <div class="header__controls">
                    <button aria-label="Switch Theme" aria-pressed="false" class="theme-switch" type="button">
                        <span aria-hidden="true" class="theme-switch__light"><img alt="light theme" src="assets/images/Sun.svg"></span>
                        <span aria-hidden="true" class="theme-switch__dark"><img alt="dark theme" src="assets/images/Moon.svg"></span>
                    </button>
                    <button aria-label="Menu" class="burger__menu" type="button">
                        <span class="burger__line"></span>
                        <span class="burger__line"></span>
                    </button>
                    <a class="link__catalog" href="catalog.html">Menu<img alt="coffee cup catalog" src="assets/images/coffee-cup.svg"></a>
                </div>
            </div>
        </div>
    </header>
    <main></main>
    <footer  id="contacts">
        <div class="footer__container">
            <div class="contacts__offer">
                <h2>Sip, Savor, Smile.<br><span class="accent">It’s coffee time!</span></h2>
                <div class="contacts__icons">
                    <a class="contacts__icon" href="#"><img alt="twitter icon" src="assets/images/twitter.svg"></a>
                    <a class="contacts__icon" href="#"><img alt="instagram icon" src="assets/images/instagram.svg"></a>
                    <a class="contacts__icon" href="#"><img alt="facebook icon" src="assets/images/facebook.svg"></a>
                </div>
            </div>
            <div class="contacts__info">
                <span class="text__inverse">Contact us</span>
                <div class="contacts__links">
                    <a class="contacts__item" href="#"><img alt="location" src="assets/images/pin-alt.svg">8558 Green Rd., LA
                        <br></a>
                    <a class="contacts__item" href="tel:+16035550123"><img alt="phone number" src="assets/images/phone.svg">+1 (603)
                        555-0123 <br></a>
                    <span class="contacts__item"><img alt="clocks" src="assets/images/clock.svg">Mon–Sat: 9:00–23:00</span>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
